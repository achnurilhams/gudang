<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tamu Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* --- FORMAT CETAK ASLI (DIJAGA KETAT) --- */
        @media print {
            @page { size: A4; margin: 0; }
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            #officialPrintArea { 
                visibility: visible; 
                position: absolute; left: 0; top: 0; width: 100%; 
                padding: 10mm; display: block !important;
            }
            .print-cut-line { 
                display: flex !important; 
                align-items: center; justify-content: center; gap: 10px;
                border-top: 1px dashed #000; margin: 20px 0; padding-top: 5px;
                font-size: 8pt; color: #666; width: 100%;
            }
        }
        #officialPrintArea { display: none; }
        .invoice-box { border: 1.5px solid #000; border-radius: 12px; overflow: hidden; background: #fff; margin-bottom: 20px; }
        .inv-header-bar { 
            background: linear-gradient(90deg, #0033cc, #00aaff); 
            color: #fff; padding: 12px 20px; font-weight: 800; font-size: 13pt; 
            text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .inv-table { width: 100%; border-collapse: collapse; }
        .inv-table th { border-bottom: 1.5px solid #000; border-right: 1px solid #000; padding: 10px; font-size: 9pt; background: #f8fafc; text-align: center; text-transform: uppercase; }
        .inv-table td { border-bottom: 1px solid #000; border-right: 1px solid #000; padding: 10px; font-size: 9pt; vertical-align: middle; }
        .inv-table th:last-child, .inv-table td:last-child { border-right: none; }
        .item-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; }
        .item-row:last-child { border-bottom: none; }
        .total-highlight { 
            font-weight: 900; color: #0033cc; font-size: 11pt; 
            display: flex; justify-content: space-between; align-items: center;
            background: #f1f5f9; padding: 10px 15px; border-radius: 6px; margin-top: 5px;
        }
        .print-cut-line { display: none; }

        /* --- DASHBOARD RESPONSIVE STYLE --- */
        @media (max-width: 768px) {
            .desktop-table { display: none; }
            .mobile-list { display: block; }
        }
        @media (min-width: 769px) {
            .desktop-table { display: table; }
            .mobile-list { display: none; }
        }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-4 no-print">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Gudang<span class="text-indigo-600">Pojok Kurma</span></h1>
            <div class="flex gap-2">
                <button onclick="printDailyReport()" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-100 transition-all">
                    <i class="fas fa-file-alt mr-1"></i> Rekap Hari Ini
                </button>
                <a href="index.html" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-indigo-100 hover:scale-105 transition-all">
                    <i class="fas fa-plus mr-1"></i> Input Baru
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8 no-print">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Total Tamu</p>
                <h3 id="statTotal" class="text-3xl font-black">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Total Orderan</p>
                <h3 id="statTodayIncome" class="text-2xl font-black text-indigo-600">Rp 0</h3>
            </div>
            <div class="col-span-2 md:col-span-1 relative">
                <input type="text" id="searchInput" onkeyup="renderData()" placeholder="Cari supplier atau sales..." class="w-full h-full bg-white border border-slate-200 rounded-3xl px-12 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-[2rem] shadow-sm overflow-hidden">
            <table class="desktop-table w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest">
                        <th class="px-6 py-4">Waktu</th>
                        <th class="px-6 py-4">Supplier & Sales</th>
                        <th class="px-6 py-4 text-right">Total Tagihan</th>
                        <th class="px-6 py-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="desktopTableBody" class="divide-y divide-slate-50"></tbody>
            </table>

            <div id="mobileListBody" class="mobile-list divide-y divide-slate-50"></div>
        </div>
    </main>

    <div id="detailModal" class="hidden fixed inset-0 z-[100] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/60 backdrop-blur-sm no-print">
        <div class="bg-white w-full max-w-lg rounded-t-[2.5rem] md:rounded-[2.5rem] shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300">
            <div class="p-6 flex justify-between items-center border-b border-slate-50">
                <h3 class="text-xl font-black">Detail Transaksi</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-slate-600"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>
            <div class="p-6 space-y-4" id="modalContent"></div>
            <div class="p-6 bg-slate-50 border-t border-slate-100">
                <button id="btnSinglePrint" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
    </div>

    <div id="officialPrintArea">
        <div id="printBody"></div>
    </div>

    <script>
        const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);

        function renderData() {
            const orders = JSON.parse(localStorage.getItem('warehouse_orders')) || [];
            const search = document.getElementById('searchInput').value.toLowerCase();
            const desktopBody = document.getElementById('desktopTableBody');
            const mobileBody = document.getElementById('mobileListBody');
            const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const todayTotal = orders.filter(o => o.date === todayStr).reduce((acc, curr) => acc + (curr.total || 0), 0);
            document.getElementById('statTotal').innerText = orders.length;
            document.getElementById('statTodayIncome').innerText = formatRupiah(todayTotal);

            const filtered = orders.filter(o => 
                o.supplier.toLowerCase().includes(search) || 
                (o.sales && o.sales.toLowerCase().includes(search))
            ).reverse();

            if(filtered.length === 0) {
                const emptyMsg = `<tr><td colspan="4" class="py-10 text-center text-slate-400">Tidak ada data</td></tr>`;
                desktopBody.innerHTML = emptyMsg;
                mobileBody.innerHTML = `<div class="p-10 text-center text-slate-400">Tidak ada data</div>`;
                return;
            }

            // Desktop Render dengan info Sales
            desktopBody.innerHTML = filtered.map(o => `
                <tr class="hover:bg-indigo-50/30 transition-colors">
                    <td class="px-6 py-4">
                        <div class="text-[10px] font-black text-indigo-400 uppercase tracking-tighter">#${o.id}</div>
                        <div class="text-xs font-bold text-slate-400">${o.time}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-black text-slate-800 uppercase text-sm">${o.supplier}</div>
                        <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wide">
                            <i class="fas fa-user-tie mr-1 text-indigo-300"></i>${o.sales || '-'} • ${o.phone || '-'}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right font-black text-indigo-600 text-sm">${formatRupiah(o.total)}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="openModal(${o.id})" class="h-8 w-8 rounded-full bg-slate-100 text-slate-400 hover:bg-indigo-600 hover:text-white transition-all">
                            <i class="fas fa-eye text-xs"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            // Mobile Render dengan info Sales
            mobileBody.innerHTML = filtered.map(o => `
                <div onclick="openModal(${o.id})" class="p-5 flex justify-between items-center active:bg-slate-50">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-black bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full uppercase">#${o.id}</span>
                            <span class="text-[10px] text-slate-400 font-bold">${o.time}</span>
                        </div>
                        <div class="font-black text-slate-800 uppercase text-sm">${o.supplier}</div>
                        <div class="text-[10px] text-slate-500 font-bold">Sales: ${o.sales || '-'}</div>
                        <div class="text-xs font-bold text-indigo-600 pt-1">${formatRupiah(o.total)}</div>
                    </div>
                    <i class="fas fa-chevron-right text-slate-200"></i>
                </div>
            `).join('');
        }

        // Fungsi Detail Modal (Informasi Lengkap)
        function openModal(id) {
            const order = (JSON.parse(localStorage.getItem('warehouse_orders')) || []).find(o => o.id === id);
            if(!order) return;

            document.getElementById('modalContent').innerHTML = `
                <div class="bg-indigo-50 p-5 rounded-3xl border border-indigo-100">
                    <p class="text-[10px] font-black text-indigo-400 uppercase">Informasi Kunjungan</p>
                    <p class="font-black text-slate-900 uppercase text-lg">${order.supplier}</p>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-1 text-xs text-slate-500 font-semibold">
                        <span><i class="fas fa-user-tie mr-1"></i> ${order.sales}</span>
                        <span><i class="fas fa-phone mr-1"></i> ${order.phone}</span>
                    </div>
                </div>
                <div class="divide-y divide-slate-100 max-h-[250px] overflow-y-auto px-1">
                    ${order.items.map(i => `
                        <div class="py-3 flex justify-between items-center">
                            <div><p class="font-bold text-slate-800 text-sm">${i.name}</p><p class="text-[10px] text-slate-400 font-bold uppercase">Qty: ${i.qty}</p></div>
                            <p class="text-sm font-black text-indigo-600">${formatRupiah(i.subtotal)}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="pt-4 flex justify-between items-center border-t-2 border-dashed border-slate-200">
                    <span class="text-xs font-black uppercase text-slate-400 tracking-wider">Total Tagihan</span>
                    <span class="text-xl font-black text-indigo-600">${formatRupiah(order.total)}</span>
                </div>
            `;
            document.getElementById('btnSinglePrint').onclick = () => printInvoice(order);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        // --- ASLI: FUNGSI CETAK NOTA (SUDAH ADA SALES) ---
        function printInvoice(order) {
            const htmlContent = `
                <div class="invoice-box">
                    <div class="inv-header-bar">
                        <span>INVOICE KUNJUNGAN</span>
                        <span style="font-size: 9pt; opacity: 0.8;">#${order.id}</span>
                    </div>
                    <table class="inv-table">
                        <thead>
                            <tr>
                                <th width="40">No</th>
                                <th width="130">Waktu</th>
                                <th>Detail Pesanan Barang</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td align="center">1</td>
                                <td align="center"><b>${order.date}</b><br><small>${order.time}</small></td>
                                <td>
                                    ${order.items.map(i => `
                                        <div class="item-row">
                                            <span>${i.name} (x${i.qty})</span>
                                            <span style="font-weight:bold;">${formatRupiah(i.subtotal)}</span>
                                        </div>
                                    `).join('')}
                                    <div class="total-highlight">
                                        <span>TOTAL BAYAR</span>
                                        <span>${formatRupiah(order.total)}</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 20px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="background: #0033cc; color: white; padding: 10px; border-radius: 10px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-shopping-bag" style="font-size: 20pt;"></i>
                            </div>
                            <div>
                                <h3 style="margin: 0; font-size: 12pt; font-weight: 900; text-transform: uppercase; color: #0033cc;">TOKO POJOK KURMA</h3>
                                <p style="margin: 3px 0 0 0; font-size: 8pt; color: #555; line-height: 1.4;">
                                    Jl. Kurma No 21, Pangarangan, Sumenep<br>
                                    <b>Supplier: ${order.supplier.toUpperCase()}</b><br>
                                    Sales: ${order.sales || '-'} (${order.phone || '-'})
                                </p>
                            </div>
                        </div>
                        <div style="text-align: center; width: 180px;">
                            <p style="margin: 0 0 45px 0; font-size: 9pt; font-weight: 600;">Penerima / Admin</p>
                            <p style="margin: 0; font-size: 9pt; padding-top: 4px;">( ..................................... )</p>
                        </div>
                    </div>
                </div>
                <div>
                    <p>-------------------------------------------cut-----------------------------------------</p>
                </div>
            `;
            document.getElementById('printBody').innerHTML = htmlContent;
            window.print();
        }

        // --- ASLI: FUNGSI CETAK REKAP ---
        function printDailyReport() {
            const orders = JSON.parse(localStorage.getItem('warehouse_orders')) || [];
            const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            const todayOrders = orders.filter(o => o.date === todayStr);
            if(todayOrders.length === 0) return alert("Belum ada transaksi.");
            let grandTotal = todayOrders.reduce((acc, curr) => acc + curr.total, 0);

            let htmlContent = `
                <div class="invoice-box">
                    <div class="inv-header-bar">
                        <span>LAPORAN REKAP HARIAN</span>
                        <span style="font-size: 9pt; opacity: 0.8;">${todayStr}</span>
                    </div>
                    <table class="inv-table">
                        <thead>
                            <tr><th>No</th><th>Waktu</th><th>Supplier</th><th align="right">Tagihan</th></tr>
                        </thead>
                        <tbody>
                            ${todayOrders.map((o, index) => `
                                <tr>
                                    <td align="center">${index + 1}</td>
                                    <td align="center">${o.time}</td>
                                    <td style="font-weight: 700;">${o.supplier.toUpperCase()}</td>
                                    <td align="right" style="font-weight: 800; color: #0033cc;">${formatRupiah(o.total)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" align="right" style="padding: 15px; font-weight: 900; background: #f1f5f9;">GRAND TOTAL</td>
                                <td align="right" style="padding: 15px; font-weight: 900; background: #f1f5f9; color: #0033cc;">${formatRupiah(grandTotal)}</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            `;
            document.getElementById('printBody').innerHTML = htmlContent;
            window.print();
        }

        function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }
        window.onload = renderData;
    </script>
</body>
</html>
